# main 에 push 하면 정적 사이트(site/)를 만들어 GitHub Pages 에 올림.
# 패치 후: update.bat 으로 데이터 갱신 → data/ 변경을 커밋·push 하면 자동 반영
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5  # desktop.json 의 '바뀐 내용'(최근 커밋 제목)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -X utf8 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
